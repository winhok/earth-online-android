name: Record actual v1.5 visual acceptance
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/record-v15-visuals.yml']
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34402800774
          name: v15-device-api-35
          path: /tmp/visual-evidence
      - name: Check passing tests and commit only synthetic screenshots and provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,xml.etree.ElementTree as ET
          source=pathlib.Path('/tmp/visual-evidence')
          reports=list(source.rglob('TEST-*.xml'))
          assert len(reports)==1
          root=ET.parse(reports[0]).getroot()
          assert root.get('tests')=='65' and all(root.get(k)=='0' for k in ['failures','errors','skipped'])
          target=pathlib.Path('verification/visuals/1.5.0');target.mkdir(parents=True,exist_ok=True)
          captures=source/'verification/device/screenshots'
          files={}
          for p in sorted(captures.glob('v15-*')):
              if p.suffix not in ('.png','.txt'):continue
              if p.suffix=='.png':assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              shutil.copyfile(p,target/p.name)
              files[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sum(n.endswith('.png') for n in files)==11
          (target/'provenance.json').write_text(json.dumps(dict(source_commit='0867dd378de367a8fda57af093fcfbbd1ed45a9f',workflow_run=34402800774,artifact_id=10124502679,api=35,fixture_data='synthetic acceptance data, not user records or product defaults',files=files),indent=2))
          (target/'README.md').write_text('# Actual Android captures\n\nCaptured by VisualAcceptanceTest and ContractJourneyTest on Android API 35. These are emulator screenshots, not mockups. See provenance.json for source identity and SHA-256. 65 instrumentation tests passed in run 34402800774.\n\nThe approved direction remains .impeccable/mocks/decision/assigned.webp. Compare the two phone themes, 200% text, tablet themes, rotated editor, real deadline disclosure, batch settlement and recovery end-state.\n')
          PY
          git add verification/visuals/1.5.0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(design): record eleven real native acceptance captures and exact provenance'
          git push origin HEAD:refs/heads/release/1.5.0-completion
