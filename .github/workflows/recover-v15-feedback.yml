name: Recover v1.5 delivery evidence
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/recover-v15-feedback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact source and original signed packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence recovery/packages
          git rev-parse HEAD > recovery/source-commit.txt
          git archive --format=zip HEAD -o recovery/source.zip
          gh api 'repos/winhok/earth-online-android/actions/runs/34404025215/jobs?per_page=100' > recovery/evidence/jobs.json
          gh api 'repos/winhok/earth-online-android/actions/runs/34404025215/artifacts?per_page=100' > recovery/evidence/artifacts.json
          gh api repos/winhok/earth-online-android/actions/artifacts/10124847156/zip > recovery/packages/original-signed.zip
          echo '5592f5f51351e2dd88b81b212b99699d93d0facd792e5cbca41fb135d308f865  recovery/packages/original-signed.zip' | sha256sum --check
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('recovery/evidence')
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          summary=[]
          for job in jobs:
              summary.append({'id':job['id'],'name':job['name'],'status':job['status'],'conclusion':job.get('conclusion')})
              if job.get('conclusion') in ('failure','timed_out','cancelled'):
                  result=subprocess.run(['gh','api',f"repos/winhok/earth-online-android/actions/jobs/{job['id']}/logs"],capture_output=True,text=True,timeout=60)
                  if result.returncode:
                      summary[-1]['log_error']=result.stderr[-2000:]
                  else:
                      (root/f"job-{job['id']}.log").write_text(result.stdout)
                      lines=result.stdout.splitlines()
                      relevant=[line for line in lines if any(term in line.lower() for term in ('error','failed','traceback','permission denied','not found','assertion'))]
                      summary[-1]['diagnostic_tail']=relevant[-25:]
          text=json.dumps(summary,ensure_ascii=False,indent=2)
          (root/'summary.json').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-recovery-evidence
          path: recovery/
          if-no-files-found: error
          retention-days: 14
