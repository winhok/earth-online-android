name: Hold publication for verified visual evidence
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/hold-v15-publication.yml']
permissions:
  contents: read
  actions: write
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop only this superseded publication attempt and retain signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=34404025215
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)
          test "$sha" = '9116c10b5694fab87f9ac5ba3d18bc959f121229'
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
          if [ "$state" != 'completed' ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel"; fi
