name: Delivery workspace snapshot
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/delivery-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive latest ticket baseline and pinned compiler
        run: |
          mkdir -p /tmp/earth-delivery
          git archive --format=zip HEAD -o /tmp/earth-delivery/source.zip
          git rev-parse HEAD > /tmp/earth-delivery/source-commit.txt
          git ls-tree -r HEAD > /tmp/earth-delivery/source-tree.txt
          curl --fail --location --retry 3 'https://github.com/JetBrains/kotlin/releases/download/v2.3.10/kotlin-compiler-2.3.10.zip' -o /tmp/earth-delivery/kotlin-compiler.zip
          (cd /tmp/earth-delivery && sha256sum source.zip kotlin-compiler.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v15-source-38889ea
          path: /tmp/earth-delivery/
          retention-days: 7
          if-no-files-found: error
