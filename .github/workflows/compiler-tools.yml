name: Pinned compiler for delivery tests
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/compiler-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get official pinned Kotlin compiler
        run: |
          mkdir -p /tmp/kotlin-delivery
          curl --fail --location --retry 3 'https://github.com/JetBrains/kotlin/releases/download/v2.3.10/kotlin-compiler-2.3.10.zip' -o /tmp/kotlin-delivery/kotlin-compiler.zip
          (cd /tmp/kotlin-delivery && sha256sum kotlin-compiler.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-2.3.10-delivery
          path: /tmp/kotlin-delivery/
          retention-days: 3
          if-no-files-found: error
