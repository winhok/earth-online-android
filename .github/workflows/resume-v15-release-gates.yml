name: Resume original-signature v1.5 release gates
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/resume-v15-release-gates.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: earth-v15-recovery
  cancel-in-progress: false
env:
  BINARY_SOURCE: 9116c10b5694fab87f9ac5ba3d18bc959f121229
  VERSION_NAME: '1.5.0'
  VERSION_CODE: '2'
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Refuse to reuse a binary after any production change
        run: |
          set -euo pipefail
          git cat-file -e "$BINARY_SOURCE^{commit}"
          git diff --exit-code "$BINARY_SOURCE" HEAD -- app/src/main core/src/main app/build.gradle.kts core/build.gradle.kts app/proguard-rules.pro build.gradle.kts settings.gradle.kts gradle gradle.properties
      - name: Recover verified signed packages and original acceptance command
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          gh api repos/winhok/earth-online-android/actions/artifacts/10124847156/zip > "$RUNNER_TEMP/v15-signed.zip"
          echo "5592f5f51351e2dd88b81b212b99699d93d0facd792e5cbca41fb135d308f865  $RUNNER_TEMP/v15-signed.zip" | sha256sum --check
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile, yaml
          config=yaml.safe_load(pathlib.Path('.github/workflows/publish-v15.yml').read_text())
          jobs=[j for j in config['jobs'].values() if any('reactivecircus/android-emulator-runner@' in s.get('uses','') for s in j.get('steps',[]))]
          assert len(jobs)==1, 'Expected one existing release acceptance job'
          job=jobs[0]
          downloads=[s for s in job['steps'] if 'actions/download-artifact@' in s.get('uses','') and s.get('with',{}).get('name')=='v15-signed-packages']
          assert len(downloads)==1, 'Cannot establish existing signed-package layout'
          destination=pathlib.Path(downloads[0].get('with',{}).get('path','release-output'))
          assert not destination.is_absolute() and '..' not in destination.parts and '${{' not in str(destination)
          destination.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'v15-signed.zip') as archive:
              for item in archive.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.suffix.lower() not in ('.jks','.p12','.pfx','.pem','.key') and p.name!='credentials.json', 'Unexpected private material in package artifact'
                  assert (item.external_attr >> 16) & 0o170000 != 0o120000, 'Refuse archive symlinks'
              archive.extractall(destination)
          apks=list(destination.rglob('earth-online-1.5.0.apk'))
          assert len(apks)==1, 'Expected exactly one signed 1.5 APK'
          apk=apks[0]
          tool=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/apksigner'
          signature=subprocess.check_output([str(tool),'verify','--print-certs',str(apk)],text=True)
          assert '447baf2063785d0e45d1f267c8b8a3fb1904f7b33d88bef6cf0f922aa0b017bd' in signature.lower(), 'Signing identity differs from 1.0'
          out=pathlib.Path('verification/rescue'); out.mkdir(parents=True,exist_ok=True)
          (out/'signature.txt').write_text(signature)
          (out/'provenance.json').write_text(json.dumps({'api':int(os.environ['TEST_API']),'binary_source':os.environ['BINARY_SOURCE'],'test_source':os.environ['GITHUB_SHA'],'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest()},indent=2))
          prelude=[]
          for step in job['steps']:
              code=step.get('run','')
              if code and ('releases/download/v1.0.0' in code or 'release download v1.0.0' in code or 'actual published 1.0.0' in step.get('name','')):
                  prelude.append(code)
          assert prelude, 'Refuse to omit the in-place upgrade fixture download'
          emulators=[s for s in job['steps'] if 'reactivecircus/android-emulator-runner@' in s.get('uses','')]
          command=emulators[0]['with']['script']
          substitutions={'${{ matrix.api }}':os.environ['TEST_API'],'${{ github.sha }}':os.environ['BINARY_SOURCE']}
          for old,new in substitutions.items():
              command=command.replace(old,new)
              prelude=[s.replace(old,new) for s in prelude]
          assert '${{' not in command and all('${{' not in s for s in prelude), 'Unresolved workflow expressions require explicit review'
          for code in prelude:
              subprocess.run(['bash','-euo','pipefail','-c',code],check=True)
          old_apks=[p for p in pathlib.Path('.').rglob('*.apk') if hashlib.sha256(p.read_bytes()).hexdigest()=='e48fb969889aec5df9e80af93564b1bcf0a335f1b3a3c3fbd1146295651563a4']
          assert old_apks, 'The actual published 1.0 APK was not recovered'
          entry=pathlib.Path(os.environ['RUNNER_TEMP'])/'resume-v15-device.sh'
          entry.write_text('set -euo pipefail\ncd "$GITHUB_WORKSPACE"\nchmod +x gradlew\nfind scripts -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} \\;\ngradle :app:connectedDebugAndroidTest --stacktrace\n'+command+'\n')
          (out/'replayed-command.txt').write_text(command+'\n')
          PY
      - name: Verify current tests compile and preserve lint gates
        run: |
          set -euo pipefail
          chmod +x gradlew
          gradle :core:test :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$RUNNER_TEMP/resume-v15-device.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-release-api-${{ matrix.api }}
          path: |
            verification/
            core/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/
          if-no-files-found: error
          retention-days: 30
  verify-delivery:
    needs: device
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          pattern: v15-release-api-*
          path: recovered-device-evidence
      - name: Independently validate all device executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('recovered-device-evidence')
          summaries=[]; hashes=set()
          for api in (26,29,35,36):
              device=root/f'v15-release-api-{api}'
              p=json.loads((device/'verification/rescue/provenance.json').read_text())
              assert p['api']==api and p['binary_source']==os.environ['BINARY_SOURCE'] and p['test_source']==os.environ['GITHUB_SHA']
              hashes.add(p['apk_sha256'])
              reports=list((device/'app/build/outputs/androidTest-results').rglob('TEST-*.xml'))
              assert reports, f'Missing XML on API {api}'
              cases=[]
              for report in reports:
                  suite=ET.parse(report).getroot()
                  assert all(int(suite.get(k,'0'))==0 for k in ('failures','errors','skipped')), report
                  cases.extend(suite.findall('.//testcase'))
              assert len(cases)>=53, f'Truncated instrumented suite on API {api}'
              assert all(not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases)
              summaries.append({'api':api,'instrumented_executions':len(cases),'provenance':p})
          assert len(hashes)==1, 'Devices did not test the same signed APK'
          out=pathlib.Path('verification/rescue'); out.mkdir(parents=True,exist_ok=True)
          (out/'device-summary.json').write_text(json.dumps({'devices':summaries,'all_passed':True},indent=2))
          print(json.dumps(summaries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15-recovered-gate-summary
          path: verification/rescue/device-summary.json
          if-no-files-found: error
          retention-days: 30
