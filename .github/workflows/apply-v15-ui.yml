name: Verify v1.5 interaction delivery
on:
  push:
    branches: ['release/1.5.0-completion']
    paths: ['.github/workflows/apply-v15-ui.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source with before and after checksums
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs = ['3e8a6f216ae1f04995fa15eb9e1e30d476a9facc', 'c81507965824e9427e7e7b1d09a789f1757a42c6', '17e8d7dc39ab654cdf1535d44694f32bff1f658d', 'b616d1533f610d68712a49b581bdac731a4a05a0']
          payload = b''
          for sha in blobs:
              raw = subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'])
              content = base64.b64decode(json.loads(raw)['content'])
              assert hashlib.sha1(f'blob {len(content)}\0'.encode()+content).hexdigest()==sha
              payload += content
          assert hashlib.sha256(payload).hexdigest() == 'c09a4f50148986e0533acab39f9990b5e09fc6b21864a6fabd3abd745ddd7e83'
          decoder=lzma.LZMADecompressor()
          bundle=json.loads(decoder.decompress(payload,max_length=2_000_000))
          assert decoder.eof and not decoder.unused_data
          paths=[]
          for entry in bundle['files']:
              path=pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('app/src/','core/src/'))
              target=pathlib.Path(path)
              assert not target.is_symlink()
              before=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              assert before==entry['before'], f'Concurrent change: {path}'
              paths.append(str(path))
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'interactions.patch'
          patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for entry in bundle['files']:
              assert hashlib.sha256(pathlib.Path(entry['path']).read_bytes()).hexdigest()==entry['sha256'],entry['path']
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(actual)==set(paths)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(android): deliver contract confirmation, recovery, ledger and accessible quest interactions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/release/1.5.0-completion'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'sha={sha}\n')
          PY
  build:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Domain tests, both lint variants and Android builds
        run: |
          set -o pipefail
          ./gradlew :core:test :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-ui-build-evidence
          path: |
            /tmp/build.log
            core/build/test-results/
            app/build/reports/
            app/schemas/
          if-no-files-found: error
          retention-days: 14
  device:
    needs: [integrate,build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29,35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/emulator-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-ui-device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            verification/device/
          retention-days: 14
