name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (for example 1.0.0-rc.1)'
        required: true
        default: '1.0.0-rc.1'
      version_code:
        description: 'Positive, monotonically increasing Play version code'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Validate release metadata
        shell: bash
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Decode signing key into runner temporary storage
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify and build signed bundle
        run: gradle :core:test :app:lintRelease :app:bundleRelease :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: earth-online-${{ inputs.version_name }}-signed
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
