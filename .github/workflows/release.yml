name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (for example 1.0.0-rc.1)'
        required: true
        default: '1.0.0-rc.1'
      version_code:
        description: 'Positive, monotonically increasing Play version code'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Validate release metadata
        shell: bash
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Decode signing key into runner temporary storage
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify and build signed bundle
        run: gradle :core:test :app:lintRelease :app:bundleRelease :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: earth-online-${{ inputs.version_name }}-signed
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
